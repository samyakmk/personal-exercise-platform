<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f2ed" />
    <meta name="description" content="Plan your workouts, learn new exercises, and keep track of your training." />
    <link rel="icon" href="/favicon.ico" />
    <title>Liftmorrow — Training workspace</title>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #f5f2ed; }
      #root { display: flex; flex: 1; }
      :focus-visible { outline: 2px solid #89569e !important; outline-offset: 2px; }
      :is(nav, [role="navigation"]) a:hover { background-color: #e6dce9; }
      [data-rail-label]:is(:hover, :focus-visible)::after {
        content: attr(data-rail-label);
        pointer-events: none;
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%);
        padding: 6px 9px;
        border-radius: 5px;
        color: #fffcf8;
        background: #251b2e;
        font: 500 12px/1.35 system-ui, sans-serif;
        white-space: nowrap;
      }
      .liftmorrow-skip-link { position: fixed; inset: 10px auto auto 10px; z-index: 10; padding: 10px 14px; border-radius: 6px; background: #f4a77f; color: #251b2e; font-family: system-ui, sans-serif; }
      .liftmorrow-skip-link:not(:focus) { left: -10000px; pointer-events: none; }
      #liftmorrow-main:focus-visible { outline-offset: -2px; }
      .liftmorrow-dialog::backdrop { background: rgba(32, 22, 38, 0.58); }
      .liftmorrow-dialog { box-shadow: 0 22px 64px #251b2e52; }
      .liftmorrow-feature-shade {
        position: absolute;
        inset: 0 0 0 auto;
        width: 39%;
        background: linear-gradient(90deg, #251b2e 0%, #251b2e38 30%, transparent 68%);
        pointer-events: none;
      }
      @media (min-height: 680px) {
        .liftmorrow-dialog #liftmorrow-review-player { position: sticky; top: 10px; }
      }
      @media (forced-colors: active) {
        :focus-visible { outline-color: Highlight !important; }
        [aria-current="page"], [aria-pressed="true"] { outline: 1px solid Highlight; }
        [aria-current="page"]:focus-visible, [aria-pressed="true"]:focus-visible { outline-offset: 3px; }
      }
      ::selection { background: #f4a77f; color: #251b2e; }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use Liftmorrow.</noscript>
    <div id="root"></div>
  </body>
</html>
