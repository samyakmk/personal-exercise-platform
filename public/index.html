<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta name="description" content="Plan your workouts, learn new exercises, and keep track of your training." />
    <title>Repform — Training workspace</title>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #f6f7f2; }
      #root { display: flex; flex: 1; }
      :focus-visible { outline: 2px solid #547329 !important; outline-offset: 2px; }
      .repform-dialog::backdrop { background: rgba(13, 24, 16, 0.65); }
      .repform-dialog { box-shadow: 0 22px 80px #111e1760; }
      ::selection { background: #d0f64d; color: #101e17; }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use Repform.</noscript>
    <div id="root"></div>
  </body>
</html>
