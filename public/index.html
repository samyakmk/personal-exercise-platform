<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2eee5" />
    <meta name="description" content="Plan your workouts, learn new exercises, and keep track of your training." />
    <link rel="icon" href="/favicon.ico" />
    <title>Trainer Plus — Training workspace</title>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #f2eee5; }
      #root { display: flex; flex: 1; }
      :focus-visible { outline: 2px solid #31583a !important; outline-offset: 2px; }
      :where([role="navigation"], #trainer-plus-overview-feature, #trainer-plus-profile-gate, #trainer-plus-sessions-feature) :focus-visible { outline-color: #d9ef77 !important; }
      .trainer-plus-dialog :focus-visible { outline-color: #31583a !important; }
      [role="navigation"] a:hover { background-color: #21442e; }
      :is([data-secondary-navigation], [data-workspace-shortcut]):hover { background-color: #e7ebdb; }
      .trainer-plus-skip-link { position: fixed; inset: 10px auto auto 10px; z-index: 10; padding: 10px 14px; border-radius: 3px; background: #d9ef77; color: #102e1d; font-family: system-ui, sans-serif; }
      .trainer-plus-skip-link:not(:focus) { left: -10000px; pointer-events: none; }
      #trainer-plus-main:focus-visible { outline-offset: -2px; }
      #trainer-plus-profile-gate #trainer-plus-main:focus-visible { outline: none !important; }
      .trainer-plus-dialog::backdrop { background: #102e1d99; }
      .trainer-plus-dialog { box-shadow: 0 22px 64px #102e1d52; }
      @media (max-height: 540px) {
        [role="navigation"] { overflow-y: auto; scrollbar-width: thin; }
      }
      @media (min-height: 680px) {
        .trainer-plus-dialog #trainer-plus-review-player { position: sticky; top: 10px; }
      }
      @media (forced-colors: active) {
        :focus-visible, :where([role="navigation"], #trainer-plus-overview-feature, #trainer-plus-profile-gate, #trainer-plus-sessions-feature) :focus-visible, .trainer-plus-dialog :focus-visible { outline-color: Highlight !important; }
        [aria-current="page"], [aria-pressed="true"] { outline: 1px solid Highlight; }
        [aria-current="page"]:focus-visible, [aria-pressed="true"]:focus-visible { outline-offset: 3px; }
      }
      ::selection { background: #d9ef77; color: #102e1d; }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to use Trainer Plus.</noscript>
    <div id="root"></div>
  </body>
</html>
